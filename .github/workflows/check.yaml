name: check
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Run checks
        run: cd dev && nix flake check -L

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Build package
        run: nix build -L
      - name: Check version
        run: |
          version=$(nix run . -- --version)
          echo "Detected version: $version"
          if ! echo "$version" | grep -E "^codex-cli [0-9]+\.[0-9]+\.[0-9]+"; then
            echo "Error: Version output does not match expected format"
            exit 1
          fi
          echo "✅ Version check passed: $version"
      - name: Check package layout
        run: |
          # The upstream archive layout has to survive intact in $out, because
          # codex derives its resource directories from it at runtime.
          for f in \
            bin/codex \
            libexec/codex/codex-package.json \
            libexec/codex/bin/codex \
            libexec/codex/bin/codex-code-mode-host \
            libexec/codex/codex-path/rg \
            libexec/codex/codex-resources/zsh/bin/zsh
          do
            test -e "result/$f" || { echo "Error: missing $f"; exit 1; }
          done
          if [ "$RUNNER_OS" = Linux ]; then
            test -x result/libexec/codex/codex-resources/bwrap \
              || { echo "Error: missing codex-resources/bwrap"; exit 1; }
          fi
          echo "✅ package layout intact"

      - name: Check patched zsh runs
        if: runner.os == 'Linux'
        run: |
          # The bundled zsh fork is the only dynamically linked binary in the
          # archive, so it is the one that patchelf has to get right.
          out=$(./result/libexec/codex/codex-resources/zsh/bin/zsh -c 'echo ok')
          test "$out" = ok || { echo "Error: bundled zsh did not run"; exit 1; }
          echo "✅ bundled zsh runs"

      - name: Check bundled resources resolve
        run: |
          # codex locates its bundled rg, bwrap and patched zsh relative to the
          # package root it derives from `current_exe`. Prove that lookup still
          # works from the Nix store layout instead of only checking --version.
          rg_path=$(nix run . -- sandbox -- sh -c 'command -v rg')
          echo "Resolved rg: $rg_path"
          case "$rg_path" in
            /nix/store/*/libexec/codex/codex-path/rg) echo "✅ bundled rg resolved" ;;
            *) echo "Error: bundled rg was not resolved from the package layout"; exit 1 ;;
          esac
